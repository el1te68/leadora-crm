name: leadora

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: leadora
      POSTGRES_USER: leadora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadora}
      TZ: Asia/Tehran
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadora -d leadora"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "${MAILHOG_PORT:-8025}:8025"   # web UI → http://localhost:8025
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1025 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=leadora;Username=leadora;Password=${POSTGRES_PASSWORD:-leadora}"
      Jwt__Key: ${JWT_KEY:-change-me-to-a-long-random-secret-of-at-least-32-chars}
      Smtp__Host: mailhog
      Smtp__Port: "1025"
      App__PublicUrl: ${PUBLIC_URL:-http://localhost:8080}
      Cors__Origins__0: ${PUBLIC_URL:-http://localhost:8080}
      Seed__Demo: ${SEED_DEMO:-true}
    ports:
      - "${API_PORT:-5080}:8080"       # optional: direct API + Scalar docs at http://localhost:5080/docs
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 6

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"         # the app → http://localhost:8080

volumes:
  pgdata:
